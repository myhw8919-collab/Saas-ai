<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NEXUS AI — Multi-Model Autonome Werkruimte</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;--bg2:#0d0d18;--bg3:#111120;--bg4:#16162a;
  --border:#1e1e35;--border2:#2a2a45;
  --text:#d4d4e8;--text2:#8888aa;--text3:#555570;
  --accent:#4f6ef7;--accent2:#3d5ce5;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--cyan:#06b6d4;
  --font:'Inter',system-ui,sans-serif;
}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--font);cursor:pointer}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.5rem;
  background:rgba(8,8,16,.97);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:300;
  backdrop-filter:blur(20px);
}
.brand{display:flex;align-items:center;gap:.6rem}
.brand-mark{
  width:30px;height:30px;
  background:var(--accent);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:800;color:#fff;letter-spacing:-.03em;
}
.brand-name{font-weight:700;font-size:.9rem;letter-spacing:-.02em;color:#fff}
.brand-version{font-size:.65rem;color:var(--text3);margin-left:.3rem}
.topbar-right{display:flex;align-items:center;gap:.75rem}
.indicator{display:flex;align-items:center;gap:.4rem;font-size:.7rem;color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.dot.live{background:var(--green);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.model-count{font-size:.7rem;color:var(--text3);background:var(--bg3);border:1px solid var(--border);padding:.2rem .55rem;border-radius:4px}

/* LAYOUT */
.workspace{display:grid;grid-template-columns:1fr;gap:0;min-height:calc(100vh - 45px)}
.panel-top{padding:1.5rem;border-bottom:1px solid var(--border)}
.panel-main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 45px - 180px)}
@media(max-width:900px){.panel-main{grid-template-columns:1fr}}
.sidebar{border-right:1px solid var(--border);padding:1rem;overflow-y:auto;background:var(--bg2)}
.content-area{display:flex;flex-direction:column;overflow:hidden}

/* COMMAND INPUT */
.cmd-section{max-width:900px}
.cmd-label{font-size:.65rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.6rem}
.cmd-input-wrap{display:flex;gap:.6rem;align-items:flex-start}
.cmd-textarea{
  flex:1;background:var(--bg3);border:1px solid var(--border2);
  border-radius:6px;padding:.65rem .8rem;
  color:var(--text);font-family:var(--font);font-size:.82rem;
  resize:none;outline:none;min-height:56px;line-height:1.5;
  transition:border-color .15s;
}
.cmd-textarea:focus{border-color:var(--accent)}
.cmd-textarea::placeholder{color:var(--text3)}
.cmd-controls{display:flex;flex-direction:column;gap:.4rem;min-width:140px}
.budget-field{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:6px;padding:.5rem .65rem;
  color:var(--text);font-family:var(--font);font-size:.78rem;outline:none;width:100%;
}
.budget-field::placeholder{color:var(--text3)}
.run-btn{
  background:var(--accent);border:none;color:#fff;
  padding:.55rem .7rem;border-radius:6px;
  font-weight:600;font-size:.75rem;letter-spacing:.01em;
  transition:background .15s,transform .1s;white-space:nowrap;
}
.run-btn:hover{background:var(--accent2)}
.run-btn:active{transform:scale(.98)}
.run-btn:disabled{background:var(--bg4);color:var(--text3);cursor:not-allowed}
.stop-btn{
  background:transparent;border:1px solid var(--red);color:var(--red);
  padding:.55rem .7rem;border-radius:6px;font-weight:600;font-size:.75rem;
}

/* PRESETS */
.preset-row{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.85rem}
.preset{
  background:transparent;border:1px solid var(--border);color:var(--text2);
  padding:.22rem .6rem;border-radius:4px;font-size:.68rem;
  transition:all .15s;
}
.preset:hover{border-color:var(--accent);color:var(--text)}

/* PROGRESS */
.progress-strip{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:.75rem 1.5rem;
  display:none;
}
.prog-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.prog-label{font-size:.7rem;color:var(--text2)}
.prog-pct{font-size:.7rem;font-weight:600;color:var(--accent)}
.prog-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s ease}
.phase-list{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}
.phase-tag{
  font-size:.63rem;padding:.15rem .5rem;border-radius:3px;
  border:1px solid transparent;color:var(--text3);background:transparent;
  transition:all .2s;
}
.phase-tag.done{color:var(--green);background:#22c55e12;border-color:#22c55e22}
.phase-tag.active{color:var(--accent);background:#4f6ef714;border-color:var(--accent)}

/* SIDEBAR */
.sidebar-section{margin-bottom:1.25rem}
.sidebar-title{font-size:.62rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.55rem}

/* MODEL CARDS */
.model-card{
  display:flex;align-items:center;gap:.5rem;
  padding:.45rem .55rem;border-radius:5px;
  border:1px solid transparent;
  margin-bottom:.3rem;transition:all .2s;
  cursor:default;
}
.model-card.active{background:var(--bg3);border-color:var(--border2)}
.model-card.working{background:#4f6ef708;border-color:#4f6ef733}
.model-card.done{background:#22c55e08;border-color:#22c55e22}
.model-icon{
  width:26px;height:26px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0;
}
.model-meta{flex:1;min-width:0}
.model-name{font-size:.75rem;font-weight:600;color:var(--text);line-height:1.2}
.model-role{font-size:.62rem;color:var(--text3);line-height:1.2}
.model-status{font-size:.62rem;font-weight:500;padding:.1rem .35rem;border-radius:3px}
.model-task{font-size:.65rem;color:var(--text3);margin-top:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-bar{height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:.25rem}
.model-bar-fill{height:100%;border-radius:1px;transition:width .4s ease}

/* BUDGET MINI */
.budget-card{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:5px;padding:.65rem;margin-top:.4rem;
  display:none;
}
.budget-row{display:flex;justify-content:space-between;font-size:.7rem;margin-bottom:.3rem}
.budget-val{font-weight:600;color:var(--green)}
.budget-bar-wrap{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.budget-bar-fill{height:100%;background:var(--green);transition:width .5s}
.budget-total{font-size:.62rem;color:var(--text3);margin-top:.25rem}

/* TERMINAL */
.terminal-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:320px}
.terminal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.5rem .9rem;background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.terminal-dots{display:flex;gap:5px}
.tdot{width:8px;height:8px;border-radius:50%}
.terminal-label{font-size:.65rem;color:var(--text3);margin-left:.4rem;font-family:'JetBrains Mono','Courier New',monospace}
.terminal-meta{display:flex;align-items:center;gap:.5rem}
.terminal-live{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse-dot 1.5s infinite;display:none}
.terminal-count{font-size:.62rem;color:var(--text3)}
.terminal-body{
  flex:1;overflow-y:auto;padding:.6rem .9rem;
  font-family:'JetBrains Mono','Courier New',monospace;
  background:var(--bg);
  min-height:280px;max-height:320px;
}
.log-entry{display:flex;gap:.4rem;font-size:.68rem;line-height:1.6;align-items:flex-start;margin-bottom:.05rem}
.log-ts{color:var(--text3);flex-shrink:0;font-size:.62rem;padding-top:1px;min-width:56px}
.log-src{font-weight:700;font-size:.63rem;flex-shrink:0;padding-top:1px;min-width:60px}
.log-sym{flex-shrink:0;padding-top:1px;width:10px}
.log-text{word-break:break-word;color:var(--text2)}
.log-text.success{color:#4ade80}
.log-text.warning{color:#fbbf24}
.log-text.error{color:#f87171}
.log-text.action{color:#a78bfa}
.terminal-idle{font-size:.72rem;color:var(--text3);padding:.5rem 0}
.blink{animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* OUTPUT PANEL */
.output-panel{border-top:1px solid var(--border);background:var(--bg2)}
.output-tabs-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.5rem .9rem;border-bottom:1px solid var(--border);
  flex-wrap:wrap;gap:.4rem;
}
.output-tabs{display:flex;gap:.25rem;flex-wrap:wrap}
.output-tab{
  background:transparent;border:1px solid var(--border);
  color:var(--text3);padding:.2rem .55rem;border-radius:3px;
  font-size:.67rem;font-family:var(--font);transition:all .15s;
}
.output-tab.active{border-color:var(--accent);color:var(--accent);background:#4f6ef710}
.output-actions{display:flex;gap:.3rem}
.action-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--text2);padding:.2rem .55rem;border-radius:3px;
  font-size:.65rem;font-family:var(--font);transition:all .15s;
}
.action-btn:hover{border-color:var(--accent);color:var(--text)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.output-file-meta{
  padding:.5rem .9rem;border-bottom:1px solid var(--border);
  display:none;align-items:center;gap:.5rem;
}
.file-tag{
  font-size:.62rem;padding:.1rem .4rem;border-radius:3px;
  background:var(--bg3);border:1px solid var(--border);color:var(--text3);
}
.file-title{font-weight:600;font-size:.8rem}
.file-desc{font-size:.65rem;color:var(--text3);margin-top:1px}
.toggle-mode{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text3);padding:.15rem .45rem;border-radius:3px;font-size:.63rem;font-family:var(--font);display:none}
.preview-iframe{width:100%;border:none;display:block;height:520px}
.code-output{
  padding:.7rem .9rem;font-size:.65rem;color:#94a3b8;
  overflow:auto;max-height:520px;
  font-family:'JetBrains Mono','Courier New',monospace;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;
  background:var(--bg);
}
.output-placeholder{padding:2rem;text-align:center;color:var(--text3)}
.output-placeholder-icon{font-size:1.4rem;margin-bottom:.4rem;opacity:.4}
.output-placeholder-text{font-size:.75rem}

/* COMPLETE */
.complete-bar{
  padding:.75rem 1.5rem;
  background:#22c55e0a;border-bottom:1px solid #22c55e22;
  display:none;align-items:center;gap:.8rem;
}
.complete-icon{font-size:1rem;color:var(--green)}
.complete-title{font-weight:600;font-size:.82rem;color:var(--green)}
.complete-sub{font-size:.7rem;color:#86efac;margin-top:.1rem}
.complete-close{margin-left:auto;background:transparent;border:1px solid #22c55e44;color:#4ade80;padding:.2rem .5rem;border-radius:3px;font-size:.65rem;font-family:var(--font)}

/* WARN */
.warn-bar{
  padding:.55rem 1.5rem;background:#f59e0b0a;border-bottom:1px solid #f59e0b22;
  font-size:.72rem;color:var(--amber);display:none;
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">NX</div>
    <span class="brand-name">NEXUS AI</span>
    <span class="brand-version">v4.0</span>
  </div>
  <div class="topbar-right">
    <div class="indicator"><span class="dot" id="live-dot"></span><span id="live-label">Gereed</span></div>
    <div class="model-count" id="model-count">12 modellen</div>
  </div>
</div>

<div class="workspace">

  <!-- TOP: COMMAND -->
  <div class="panel-top">
    <div class="cmd-section">
      <div class="cmd-label">Opdracht</div>
      <div class="cmd-input-wrap">
        <textarea class="cmd-textarea" id="cmd-input" rows="2"
          placeholder="Beschrijf wat u nodig heeft. Het systeem selecteert automatisch de juiste modellen en levert een volledig resultaat."></textarea>
        <div class="cmd-controls">
          <input type="number" class="budget-field" id="budget-input" placeholder="Budget (€)" min="0"/>
          <div id="action-area">
            <button class="run-btn" id="run-btn" onclick="start()" style="width:100%">Uitvoeren</button>
          </div>
        </div>
      </div>
      <div class="preset-row">
        <button class="preset" onclick="p(0)">Game development — PS5</button>
        <button class="preset" onclick="p(1)">Belastingoptimalisatie NL</button>
        <button class="preset" onclick="p(2)">SaaS product bouwen</button>
        <button class="preset" onclick="p(3)">Marketing campagne</button>
        <button class="preset" onclick="p(4)">3D product visualisatie</button>
        <button class="preset" onclick="p(5)">E-commerce platform</button>
        <button class="preset" onclick="p(6)">Jaarrekening analyse</button>
        <button class="preset" onclick="p(7)">Video contentplan</button>
      </div>
    </div>
  </div>

  <!-- WARN / COMPLETE -->
  <div id="warn-bar" class="warn-bar"></div>
  <div id="complete-bar" class="complete-bar">
    <span class="complete-icon">&#10003;</span>
    <div>
      <div class="complete-title">Taak voltooid</div>
      <div class="complete-sub" id="complete-sub"></div>
    </div>
    <button class="complete-close" onclick="document.getElementById('complete-bar').style.display='none'">Sluiten</button>
  </div>

  <!-- PROGRESS -->
  <div class="progress-strip" id="progress-strip">
    <div class="prog-meta">
      <span class="prog-label" id="prog-phase-label">Initialiseren...</span>
      <span class="prog-pct" id="prog-pct">0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="phase-list" id="phase-list"></div>
  </div>

  <!-- MAIN PANEL -->
  <div class="panel-main">

    <!-- SIDEBAR: MODELS -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Actieve modellen</div>
        <div id="model-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Budget</div>
        <div class="budget-card" id="budget-card">
          <div class="budget-row">
            <span style="color:var(--text2)">Verbruikt</span>
            <span class="budget-val" id="bv">€0</span>
          </div>
          <div class="budget-bar-wrap"><div class="budget-bar-fill" id="bf" style="width:0%"></div></div>
          <div class="budget-total" id="bt">—</div>
        </div>
        <div id="no-budget" style="font-size:.68rem;color:var(--text3);margin-top:.3rem">Geen budget ingesteld</div>
      </div>
    </div>

    <!-- RIGHT: TERMINAL + OUTPUT -->
    <div class="content-area">

      <!-- TERMINAL -->
      <div class="terminal-wrap">
        <div class="terminal-header">
          <div style="display:flex;align-items:center">
            <div class="terminal-dots">
              <div class="tdot" style="background:#ff5f57"></div>
              <div class="tdot" style="background:#ffbd2e"></div>
              <div class="tdot" style="background:#28c840"></div>
            </div>
            <span class="terminal-label">system.log</span>
          </div>
          <div class="terminal-meta">
            <span class="terminal-live" id="tl"></span>
            <span class="terminal-count"><span id="log-n">0</span> entries</span>
          </div>
        </div>
        <div class="terminal-body" id="term">
          <div class="terminal-idle">Systeem gereed. <span class="blink">_</span></div>
        </div>
      </div>

      <!-- OUTPUT -->
      <div class="output-panel" id="output-panel" style="display:none">
        <div class="output-tabs-bar">
          <div class="output-tabs" id="out-tabs"></div>
          <div class="output-actions">
            <button class="toggle-mode" id="toggle-mode" onclick="toggleMode()">Broncode</button>
            <button class="action-btn" onclick="dlActive()">Exporteren</button>
            <button class="action-btn primary" onclick="dlAll()">Alles exporteren</button>
          </div>
        </div>
        <div class="output-file-meta" id="out-meta">
          <span class="file-tag" id="out-tag">—</span>
          <div>
            <div class="file-title" id="out-title">—</div>
            <div class="file-desc" id="out-desc">—</div>
          </div>
        </div>
        <div id="out-body">
          <div class="output-placeholder">
            <div class="output-placeholder-icon">&#128196;</div>
            <div class="output-placeholder-text">Uitvoer verschijnt na voltooiing van de taak.</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ── PRESETS ───────────────────────────────────────────────────
const PRESETS = [
  "Ontwikkel een volledig PS5-spel: game engine architectuur, gameplay mechanics, asset pipeline, audio systeem, netcode voor multiplayer, volledige broncode structuur en productieplan",
  "Analyseer de Nederlandse belastingwetgeving 2024–2025: optimale structuur voor minimale belastingdruk, box 1/2/3 optimalisatie, investeringsaftrek, BV-structuur vs IB, dividend vs salaris, vermogensrendementsheffing, alle relevante wetgeving en concrete berekeningen",
  "Bouw een volledige SaaS-applicatie: authenticatie, subscriptions, dashboard, API, database schema, deployment pipeline, pricing strategie en go-to-market plan",
  "Ontwikkel een complete 360-graden marketing campagne: contentstrategie, advertentiebudgetten per kanaal, ROI-prognoses, video scripts, A/B testing framework en implementatietijdlijn",
  "Creëer een interactieve 3D productvisualisatie met WebGL: fotorealistische rendering, animaties, AR-ready export, configurator UI en technische documentatie",
  "Bouw een volledige e-commerce omgeving: productmanagement, checkout, betalingsintegratie, logistiek koppeling, analytics dashboard en schaalarchitectuur",
  "Voer een volledige jaarrekening analyse uit: balans, winst- en verliesrekening, cashflow, ratio-analyse, benchmarking en strategische aanbevelingen",
  "Produceer een compleet video contentplan: scripts, storyboards, productieschema, distributieplan per platform, engagement strategie en monetisatiemodel"
];
function p(i){document.getElementById('cmd-input').value=PRESETS[i];}

// ── MODELS ────────────────────────────────────────────────────
const MODELS = [
  {id:'gpt4',name:'GPT-4o',org:'OpenAI',color:'#10a37f',role:'Redenering & Code',caps:['code','text','analysis']},
  {id:'claude',name:'Claude 3.5',org:'Anthropic',color:'#cc785c',role:'Analyse & Schrijven',caps:['text','analysis','code']},
  {id:'gemini',name:'Gemini 1.5 Pro',org:'Google',color:'#4285f4',role:'Multimodaal & Research',caps:['text','image','video','audio']},
  {id:'grok',name:'Grok 2',org:'xAI',color:'#1da1f2',role:'Real-time & Redenering',caps:['text','realtime']},
  {id:'llama',name:'Llama 3.1',org:'Meta',color:'#0668E1',role:'Open-source Fundament',caps:['text','code']},
  {id:'mistral',name:'Mistral Large',org:'Mistral',color:'#ff7000',role:'Efficiënte Inferentie',caps:['text','code']},
  {id:'dalle',name:'DALL-E 3',org:'OpenAI',color:'#10a37f',role:'Beeldgeneratie',caps:['image']},
  {id:'midjourney',name:'Midjourney v6',org:'Midjourney',color:'#7c5cbf',role:'Creatieve Beelden',caps:['image']},
  {id:'sora',name:'Sora',org:'OpenAI',color:'#10a37f',role:'Videogeneratie',caps:['video']},
  {id:'runway',name:'Runway Gen-3',org:'Runway',color:'#e63946',role:'Video & Effecten',caps:['video']},
  {id:'elevenlabs',name:'ElevenLabs',org:'ElevenLabs',color:'#6c47ff',role:'Spraak & Audio',caps:['audio']},
  {id:'perplexity',name:'Perplexity',org:'Perplexity',color:'#20b2aa',role:'Live Onderzoek',caps:['search','text']},
];

const PHASES = [
  {id:'init',label:'Initialisatie'},
  {id:'research',label:'Onderzoek'},
  {id:'analysis',label:'Analyse'},
  {id:'generation',label:'Generatie'},
  {id:'review',label:'Verificatie'},
  {id:'optimization',label:'Optimalisatie'},
  {id:'output',label:'Uitvoer'},
];

const SC = {idle:'#555570',working:'#4f6ef7',done:'#22c55e',error:'#ef4444'};
const SL = {idle:'Wacht',working:'Actief',done:'Gereed',error:'Fout'};
const LC = {info:'var(--text2)',success:'success',warning:'warning',error:'error',action:'action'};
const LI = {info:'·',success:'✓',warning:'!',error:'✗',action:'›'};

let running=false, logs=[], outputs=[], activeOut=0, viewMode='preview';

// ── INIT UI ───────────────────────────────────────────────────
function initModels(){
  document.getElementById('model-list').innerHTML = MODELS.map(m=>`
    <div class="model-card" id="mc-${m.id}">
      <div class="model-icon" style="background:${m.color}">${m.name.slice(0,2).toUpperCase()}</div>
      <div class="model-meta">
        <div style="display:flex;align-items:center;justify-content:space-between">

function setModel(id, status, task, pct){

  const c = SC[status]||SC.idle;
  const card = document.getElementById('mc-'+id);
  card.className = 'model-card' + (status!=='idle'?' '+status:'');
  const sb = document.getElementById('ms-'+id);
  sb.style.background=c+'18'; sb.style.color=c; sb.style.border=`1px solid ${c}30`;

function setPhase(phaseId, progress){
  document.getElementById('prog-fill').style.width=progress+'%';
  document.getElementById('prog-pct').textContent=progress+'%';
  const ph = PHASES.find(p=>p.id===phaseId);
  if(ph) document.getElementById('prog-phase-label').textContent=ph.label;
  const ci = PHASES.findIndex(p=>p.id===phaseId);
  PHASES.forEach((p,i)=>{
    const el=document.getElementById('pt-'+p.id); if(!el)return;
    el.className='phase-tag'+(i<ci?' done':p.id===phaseId?' active':'');
  });
}

function log(modelId, msg, level='info'){
  logs.push({modelId, msg, level, t:Date.now()});
  const m = MODELS.find(x=>x.id===modelId);
  const term = document.getElementById('term');
  if(logs.length===1) term.innerHTML='';
  const ts = new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const lc = level==='info'?'var(--text2)':level==='success'?'#4ade80':level==='warning'?'#fbbf24':level==='error'?'#f87171':'#a78bfa';
  const d=document.createElement('div'); d.className='log-entry';
  d.innerHTML=`<span class="log-ts">${ts}</span><span class="log-src" style="color:${m?.color||'var(--text3)'}">${m?.name.split(' ')[0]||modelId}</span><span class="log-sym" style="color:${lc}">${LI[level]||'·'}</span><span class="log-text ${level!=='info'?level:''}">${msg}</span>`;
  term.appendChild(d);
  term.scrollTop=term.scrollHeight;
  document.getElementById('log-n').textContent=logs.length;
}

function addOutput(type, title, desc, content){
  outputs.push({type,title,desc,content});
  document.getElementById('output-panel').style.display='block';
  renderTabs(); showOut(outputs.length-1);
}

const TYPE_LABELS = {website:'Web',app:'Applicatie',report:'Rapport',code:'Broncode',analysis:'Analyse',ads:'Marketing',doc:'Document',video:'Video'};
function renderTabs(){
  document.getElementById('out-tabs').innerHTML=outputs.map((o,i)=>`
    <button class="output-tab${i===activeOut?' active':''}" onclick="showOut(${i})">${TYPE_LABELS[o.type]||o.type}</button>`).join('');
}
function showOut(i){
  activeOut=i; viewMode='preview'; renderTabs();
  const o=outputs[i]; if(!o)return;
  const isH=['website','app'].includes(o.type);
  document.getElementById('out-meta').style.display='flex';
  document.getElementById('out-tag').textContent=TYPE_LABELS[o.type]||o.type;
  document.getElementById('out-title').textContent=o.title;
  document.getElementById('out-desc').textContent=o.desc;
  const tm=document.getElementById('toggle-mode');
  tm.style.display=isH?'block':'none'; tm.textContent='Broncode';
  renderOutBody(o,isH,viewMode);
}
function renderOutBody(o,isH,mode){
  const b=document.getElementById('out-body');
  if(isH&&mode==='preview'){
    b.innerHTML=`<iframe class="preview-iframe" sandbox="allow-scripts allow-same-origin" srcdoc="${escA(o.content)}"></iframe>`;
  } else {
    b.innerHTML=`<pre class="code-output">${esc(o.content)}</pre>`;
  }
}
function toggleMode(){
  const o=outputs[activeOut]; if(!o)return;
  const isH=['website','app'].includes(o.type);
  viewMode=viewMode==='preview'?'code':'preview';
  document.getElementById('toggle-mode').textContent=viewMode==='preview'?'Broncode':'Preview';
  renderOutBody(o,isH,viewMode);
}
function dlActive(){
  const o=outputs[activeOut]; if(!o)return;
  const ext=['website','app'].includes(o.type)?'html':o.type==='report'?'md':o.type==='code'?'js':'txt';
  dl(o.title.replace(/\s+/g,'-').toLowerCase()+'.'+ext, o.content);
}
function dlAll(){outputs.forEach((o,i)=>setTimeout(()=>dlActive.call({activeOut:i}),i*300));}
function dl(name,content){
  const b=new Blob([content],{type:'text/plain'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}

function detectIntent(cmd){
  const l=cmd.toLowerCase();
  if(l.includes('ps5')||l.includes('game')||l.includes('spel')||l.includes('unity')||l.includes('unreal')) return 'game';
  if(l.includes('belast')||l.includes('boekhouding')||l.includes('btw')||l.includes('bv')||l.includes('fiscaal')||l.includes('belasting')) return 'tax';
  if(l.includes('video')||l.includes('film')||l.includes('reel')||l.includes('youtube')||l.includes('tiktok')) return 'video';
  if(l.includes('3d')||l.includes('visualisatie')||l.includes('render')||l.includes('three.js')) return '3d';
  if(l.includes('marketing')||l.includes('campagne')||l.includes('advertentie')) return 'marketing';
  if(l.includes('jaarrekening')||l.includes('balans')||l.includes('winst')||l.includes('analyse')) return 'finance';
  if(l.includes('saas')||l.includes('applicatie')||l.includes('app')||l.includes('platform')) return 'saas';
  if(l.includes('shop')||l.includes('webshop')||l.includes('e-commerce')) return 'ecommerce';
  return 'general';
}

function setGeo(t){buildGeo(t);}

let drag=false,lx=0,ly=0,rotX=0,rotY=0,autoRotY=0;
renderer.domElement.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
renderer.domElement.addEventListener('mousemove',e=>{if(!drag)return;rotY+=(e.clientX-lx)*.01;rotX+=(e.clientY-ly)*.008;lx=e.clientX;ly=e.clientY});
renderer.domElement.addEventListener('mouseup',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{cam.position.z=Math.max(2,Math.min(12,cam.position.z+e.deltaY*.008))});
renderer.domElement.addEventListener('touchstart',e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY});
renderer.domElement.addEventListener('touchmove',e=>{if(!drag)return;rotY+=(e.touches[0].clientX-lx)*.01;rotX+=(e.touches[0].clientY-ly)*.008;lx=e.touches[0].clientX;ly=e.touches[0].clientY});
renderer.domElement.addEventListener('touchend',()=>drag=false);
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

let fr=0,lt=performance.now();
(function animate(){requestAnimationFrame(animate);
const t=Date.now()*.001;
if(!drag){autoRotY+=.004;mainMesh.rotation.y=autoRotY;mainMesh.rotation.x=Math.sin(t*.4)*.08;}
else{mainMesh.rotation.y=rotY;mainMesh.rotation.x=Math.max(-1,Math.min(1,rotX));}
mainMesh.position.y=Math.sin(t*.6)*.06;
orbs.forEach((o,i)=>{o.a+=o.spd*.01;o.m.position.set(Math.cos(o.a)*o.r,o.y+Math.sin(t*.8+i)*.3,Math.sin(o.a)*o.r);o.m.scale.setScalar(.9+Math.sin(t*2+i)*.1);});
fill.position.x=Math.sin(t*.5)*5;fill.position.z=Math.cos(t*.5)*4;
fr++;const now=performance.now();if(now-lt>800){document.getElementById('fps').textContent=Math.round(fr*1000/(now-lt));fr=0;lt=now;}
renderer.render(scene,cam);})();
<\/script></body></html>`;
  return { webApp };
}

const delay = ms => new Promise(r=>setTimeout(r,ms));
