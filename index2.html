<!DOCTYPE html> 
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080f;--s:#0d0d18;--s2:#111120;--b:#1e1e32;--b2:#2a2a45;--t:#d4d4e8;--t2:#7777aa;--t3:#444466;--a:#4f6ef7;--g:#22c55e;--r:#ef4444;--am:#f59e0b}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1.2rem;background:var(--s);border-bottom:1px solid var(--b);flex-shrink:0}
.brand{display:flex;align-items:center;gap:.5rem}
.brand-box{width:24px;height:24px;background:var(--a);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff}
.brand-name{font-weight:700;font-size:.85rem;letter-spacing:-.01em}
.brand-v{font-size:.58rem;color:var(--t3);margin-left:.15rem}
.top-right{display:flex;align-items:center;gap:.5rem}
.live-badge{display:flex;align-items:center;gap:.3rem;font-size:.63rem;color:var(--t2)}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--t3)}
.ldot.on{background:var(--g);animation:pulse 1.2s infinite}
.models-btn{background:transparent;border:1px solid var(--b2);color:var(--t2);padding:.2rem .55rem;border-radius:4px;font-size:.63rem;transition:all .15s}
.models-btn:hover{border-color:var(--a);color:var(--t)}

/* MODELS MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--s);border:1px solid var(--b2);border-radius:10px;padding:1.25rem;width:90%;max-width:520px;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.modal-title{font-weight:700;font-size:.9rem}
.modal-close{background:transparent;border:none;color:var(--t2);font-size:1.1rem;padding:.1rem .4rem}
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.model-card{background:var(--s2);border:1px solid var(--b);border-radius:6px;padding:.7rem;display:flex;align-items:center;gap:.5rem}
.model-icon{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:#fff;flex-shrink:0}
.model-name{font-size:.75rem;font-weight:600;line-height:1.2}
.model-role{font-size:.6rem;color:var(--t2)}
.model-status{font-size:.58rem;padding:.1rem .35rem;border-radius:3px;margin-top:.2rem;display:inline-block}

/* CMD SECTION */
.cmd-section{padding:.9rem 1.2rem;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--s)}
.cmd-row{display:flex;gap:.5rem;margin-bottom:.6rem}
.cmd-textarea{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:.5rem .7rem;color:var(--t);font-size:.8rem;resize:none;outline:none;min-height:48px;font-family:inherit;transition:border-color .15s;line-height:1.5}
.cmd-textarea:focus{border-color:var(--a)}
.cmd-textarea::placeholder{color:var(--t3)}
.cmd-side{display:flex;flex-direction:column;gap:.35rem;min-width:130px}
.budget-input{background:var(--s2);border:1px solid var(--b2);border-radius:5px;padding:.42rem .6rem;color:var(--t);font-size:.75rem;outline:none;width:100%;font-family:inherit}
.budget-input::placeholder{color:var(--t3)}
.run-btn{background:var(--a);border:none;color:#fff;padding:.5rem;border-radius:5px;font-weight:700;font-size:.72rem;transition:background .15s}
.run-btn:hover{background:#3d5ce5}
.run-btn:disabled{background:var(--b2);color:var(--t3);cursor:not-allowed}
.stop-btn{background:transparent;border:1px solid var(--r);color:var(--r);padding:.5rem;border-radius:5px;font-weight:600;font-size:.72rem}
.presets{display:flex;flex-wrap:wrap;gap:.3rem}
.preset-btn{background:transparent;border:1px solid var(--b);color:var(--t3);padding:.18rem .55rem;border-radius:20px;font-size:.63rem;transition:all .15s;white-space:nowrap}
.preset-btn:hover{border-color:var(--a);color:var(--t2)}

/* PROGRESS */
.prog-strip{padding:.55rem 1.2rem;background:var(--s2);border-bottom:1px solid var(--b);display:none;flex-shrink:0}
.prog-top{display:flex;justify-content:space-between;font-size:.63rem;color:var(--t2);margin-bottom:.3rem}
.prog-pct{color:var(--a);font-weight:600}
.prog-track{height:2px;background:var(--b);border-radius:1px;overflow:hidden;margin-bottom:.4rem}
.prog-fill{height:100%;background:var(--a);border-radius:1px;transition:width .5s ease}
.phases{display:flex;flex-wrap:wrap;gap:.25rem}
.ph{font-size:.6rem;padding:.12rem .4rem;border-radius:3px;border:1px solid transparent;color:var(--t3)}
.ph.done{color:var(--g);background:#22c55e0f;border-color:#22c55e22}
.ph.active{color:var(--a);background:#4f6ef710;border-color:var(--a)}

/* COMPLETE / WARN */
.done-strip{padding:.55rem 1.2rem;background:#22c55e08;border-bottom:1px solid #22c55e22;display:none;align-items:center;gap:.6rem;flex-shrink:0}
.done-strip-txt{font-size:.75rem;color:var(--g);font-weight:600}
.done-strip-sub{font-size:.63rem;color:#86efac}
.close-done{margin-left:auto;background:transparent;border:1px solid #22c55e44;color:#4ade80;padding:.15rem .45rem;border-radius:3px;font-size:.6rem}
.warn-strip{padding:.45rem 1.2rem;background:#f59e0b08;border-bottom:1px solid #f59e0b22;font-size:.68rem;color:var(--am);display:none;flex-shrink:0}

/* MAIN CONTENT AREA */
.main-area{flex:1;display:flex;overflow:hidden;min-height:0}

/* LOG PANE */
.log-pane{width:260px;border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0;background:var(--bg)}
.pane-hdr{padding:.4rem .7rem;background:var(--s2);border-bottom:1px solid var(--b);font-size:.6rem;color:var(--t3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pane-hdr-dots{display:flex;gap:4px}
.phd{width:7px;height:7px;border-radius:50%}
.log-body{flex:1;overflow-y:auto;padding:.5rem .7rem;font-family:'JetBrains Mono','Courier New',monospace}
.log-line{display:flex;gap:.35rem;font-size:.63rem;line-height:1.65;margin-bottom:.02rem}
.log-time{color:var(--t3);flex-shrink:0;min-width:46px;font-size:.58rem;padding-top:1px}
.log-who{font-weight:700;flex-shrink:0;min-width:44px;font-size:.6rem;padding-top:1px}
.log-sym{flex-shrink:0;width:8px;color:var(--t2);padding-top:1px}
.log-txt{word-break:break-word;color:var(--t2)}
.log-txt.ok{color:#4ade80}.log-txt.warn{color:#fbbf24}.log-txt.act{color:#a78bfa}
.log-idle{font-size:.68rem;color:var(--t3);padding:.3rem 0}
.blink{animation:pulse 1s infinite}

/* OUTPUT AREA */
.output-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.out-tabbar{display:flex;align-items:center;justify-content:space-between;padding:.4rem .8rem;background:var(--s2);border-bottom:1px solid var(--b);flex-shrink:0;flex-wrap:wrap;gap:.35rem}
.out-tabs{display:flex;gap:.25rem;flex-wrap:wrap}
.out-tab{background:transparent;border:1px solid var(--b);color:var(--t3);padding:.18rem .5rem;border-radius:3px;font-size:.63rem;transition:all .15s}
.out-tab.act{border-color:var(--a);color:var(--a);background:#4f6ef710}
.out-actions{display:flex;gap:.25rem}
.out-act-btn{background:transparent;border:1px solid var(--b);color:var(--t2);padding:.18rem .5rem;border-radius:3px;font-size:.6rem;transition:all .15s}
.out-act-btn:hover{border-color:var(--a);color:var(--t)}
.out-act-btn.pri{background:var(--a);border-color:var(--a);color:#fff}

/* SPLIT VIEW: preview left, code right */
.split-view{flex:1;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;min-height:0}
.split-pane{display:flex;flex-direction:column;overflow:hidden}
.split-pane+.split-pane{border-left:1px solid var(--b)}
.split-hdr{padding:.35rem .7rem;background:var(--s2);border-bottom:1px solid var(--b);font-size:.6rem;color:var(--t3);flex-shrink:0;display:flex;align-items:center;gap:.4rem}
.split-hdr-dot{width:5px;height:5px;border-radius:50%;background:var(--g)}
.preview-iframe{flex:1;border:none;width:100%;min-height:0}
.code-view{flex:1;overflow:auto;padding:.7rem .9rem;font-family:'JetBrains Mono','Courier New',monospace;font-size:.6rem;color:#7a8ab0;line-height:1.65;white-space:pre-wrap;word-break:break-word;background:var(--bg)}
.out-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);gap:.4rem}
.out-placeholder-icon{font-size:2rem;opacity:.2}
.out-placeholder-txt{font-size:.75rem}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-box">NX</div>
    <span class="brand-name">NEXUS AI</span>
    <span class="brand-v">v4.0</span>
  </div>
  <div class="top-right">
    <div class="live-badge"><span class="ldot" id="ldot"></span><span id="live-lbl">Gereed</span></div>
    <button class="models-btn" onclick="toggleModal()">12 modellen ▾</button>
  </div>
</div>

<!-- MODELS MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)toggleModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Actieve AI-modellen</span>
      <button class="modal-close" onclick="toggleModal()">✕</button>
    </div>
    <div class="model-grid" id="model-grid"></div>
  </div>
</div>

<!-- CMD SECTION -->
<div class="cmd-section">
  <div class="cmd-row">
    <textarea class="cmd-textarea" id="cmd" rows="2" placeholder="Beschrijf uw opdracht. Bijv: maak een dropshipping website met de beste producten van 2026"></textarea>
    <div class="cmd-side">
      <input type="number" class="budget-input" id="bgt" placeholder="Budget (€)" min="0"/>
      <div id="action-area">
        <button class="run-btn" onclick="runTask()" style="width:100%">Uitvoeren</button>
      </div>
    </div>
  </div>
  <div class="presets">
    <button class="preset-btn" onclick="setP(0)">Dropshipping website</button>
    <button class="preset-btn" onclick="setP(1)">PS5 game bouwen</button>
    <button class="preset-btn" onclick="setP(2)">Belastingoptimalisatie NL</button>
    <button class="preset-btn" onclick="setP(3)">3D product visualisatie</button>
    <button class="preset-btn" onclick="setP(4)">Marketing campagne</button>
    <button class="preset-btn" onclick="setP(5)">SaaS platform</button>
  </div>
</div>

<!-- PROGRESS -->
<div class="prog-strip" id="prog-strip">
  <div class="prog-top"><span id="prog-lbl">Initialiseren...</span><span class="prog-pct" id="prog-pct">0%</span></div>
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="phases" id="phases"></div>
</div>

<!-- WARN -->
<div class="warn-strip" id="warn-strip"></div>

<!-- DONE -->
<div class="done-strip" id="done-strip">
  <div><div class="done-strip-txt">✓ Voltooid</div><div class="done-strip-sub" id="done-sub"></div></div>
  <button class="close-done" onclick="this.parentElement.style.display='none'">Sluiten</button>
</div>

<!-- MAIN -->
<div class="main-area">

  <!-- LOG PANE -->
  <div class="log-pane">
    <div class="pane-hdr">
      <span>system.log</span>
      <div class="pane-hdr-dots">
        <div class="phd" style="background:#ff5f57"></div>
        <div class="phd" style="background:#ffbd2e"></div>
        <div class="phd" style="background:#28c840"></div>
      </div>
    </div>
    <div class="log-body" id="log-body">
      <div class="log-idle">Gereed. <span class="blink">_</span></div>
    </div>
  </div>

  <!-- OUTPUT AREA -->
  <div class="output-area">
    <div class="out-tabbar">
      <div class="out-tabs" id="out-tabs"></div>
      <div class="out-actions">
        <button class="out-act-btn" id="toggle-view-btn" onclick="toggleView()" style="display:none">Broncode</button>
        <button class="out-act-btn" onclick="dlActive()">Exporteren</button>
        <button class="out-act-btn pri" onclick="dlAll()">Alles downloaden</button>
      </div>
    </div>
    <div class="split-view" id="split-view">
      <div class="out-placeholder" style="grid-column:1/-1">
        <div class="out-placeholder-icon">◻</div>
        <div class="out-placeholder-txt">Output verschijnt hier na uitvoering</div>
      </div>
    </div>
  </div>

</div>

<script>
// ── DATA ─────────────────────────────────────────────────────
const PRESETS = [
  "Maak een dropshipping website met de beste producten van 2026",
  "Ontwikkel een volledig PS5 spel met architectuur en productieplan",
  "Analyseer belastingoptimalisatie Nederland 2024-2025, minimale belastingdruk",
  "Bouw een interactieve 3D product visualisatie met WebGL",
  "Ontwikkel een complete marketing campagne met budgetverdeling",
  "Bouw een volledig SaaS platform met dashboard en API"
];

const MODELS = [
  {id:'gpt4',name:'GPT-4o',org:'OpenAI',color:'#10a37f',role:'Redenering & Code'},
  {id:'claude',name:'Claude 3.5',org:'Anthropic',color:'#cc785c',role:'Analyse & Schrijven'},
  {id:'gemini',name:'Gemini 1.5',org:'Google',color:'#4285f4',role:'Verificatie'},
  {id:'grok',name:'Grok 2',org:'xAI',color:'#1da1f2',role:'Realtime Data'},
  {id:'llama',name:'Llama 3.1',org:'Meta',color:'#0668E1',role:'Open Source'},
  {id:'mistral',name:'Mistral Large',org:'Mistral',color:'#ff7000',role:'Optimalisatie'},
  {id:'dalle',name:'DALL-E 3',org:'OpenAI',color:'#10a37f',role:'Beeldgeneratie'},
  {id:'midjourney',name:'Midjourney v6',org:'Midjourney',color:'#7c5cbf',role:'Creatief'},
  {id:'sora',name:'Sora',org:'OpenAI',color:'#10a37f',role:'Video'},
  {id:'runway',name:'Runway Gen-3',org:'Runway',color:'#e63946',role:'Video FX'},
  {id:'elevenlabs',name:'ElevenLabs',org:'ElevenLabs',color:'#6c47ff',role:'Audio'},
  {id:'perplexity',name:'Perplexity',org:'Perplexity',color:'#20b2aa',role:'Onderzoek'},
];

const PHASES = ['Initialisatie','Onderzoek','Analyse','Generatie','Verificatie','Optimalisatie','Uitvoer'];

const PRODUCTS = [
  {name:'Magnetische Laadkabel 3-in-1',price:24.99,margin:65,img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500&fit=crop',desc:'USB-C, Lightning & Micro-USB in één kabel. Compatibel met alle apparaten.',badge:'🔥 Trending',niche:'Tech'},
  {name:'Slimme LED Groeilamp',price:39.99,margin:70,img:'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=500&fit=crop',desc:'Full-spectrum LED met app-bediening en instelbare timer voor indoor planten.',badge:'⭐ Bestseller',niche:'Tuin'},
  {name:'Ergonomische Laptop Standaard',price:49.99,margin:75,img:'https://images.unsplash.com/photo-1593642632559-0c6d3fc62b89?w=500&fit=crop',desc:'Aluminium standaard, 6 instelbare hoogtes, opvouwbaar voor onderweg.',badge:'📦 Top verkoop',niche:'Office'},
  {name:'Solar Powerbank 20000mAh',price:59.99,margin:74,img:'https://images.unsplash.com/photo-1509281373149-e957c6296406?w=500&fit=crop',desc:'4 zonnepanelen, waterbestendig IP67. Laad 3 apparaten tegelijk op.',badge:'🌿 Duurzaam',niche:'Outdoor'},
  {name:'AI Huidanalyse Spiegel',price:89.99,margin:72,img:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500&fit=crop',desc:'Smart mirror met UV-analyse, huidtype detectie en persoonlijk productadvies.',badge:'🔥 Trending',niche:'Beauty'},
  {name:'Draadloze Mini Stofzuiger',price:34.99,margin:68,img:'https://images.unsplash.com/photo-1558618047-3c9e8b64a05e?w=500&fit=crop',desc:'9000PA zuigkracht, USB-C oplaadbaar. Ideaal voor auto en bureau.',badge:'⭐ Bestseller',niche:'Huis'},
];

// ── STATE ─────────────────────────────────────────────────────
let running=false, outputs=[], activeOut=0, viewMode='preview', modelStatuses={};
MODELS.forEach(m=>modelStatuses[m.id]='idle');

// ── MODAL ─────────────────────────────────────────────────────
function toggleModal(){
  const m=document.getElementById('modal');
  m.classList.toggle('open');
  renderModelGrid();
}
function renderModelGrid(){
  const SC={idle:'#444466',working:'#4f6ef7',done:'#22c55e'};
  const SL={idle:'Wacht',working:'Actief',done:'Gereed'};
  document.getElementById('model-grid').innerHTML=MODELS.map(m=>{
    const s=modelStatuses[m.id]||'idle';
    return`<div class="model-card">
      <div class="model-icon" style="background:${m.color}">${m.name.slice(0,2).toUpperCase()}</div>
      <div>
        <div class="model-name">${m.name}</div>
        <div class="model-role">${m.role}</div>
        <span class="model-status" style="background:${SC[s]}18;color:${SC[s]};border:1px solid ${SC[s]}33">${SL[s]}</span>
      </div>
    </div>`;
  }).join('');
}

// ── PRESETS ───────────────────────────────────────────────────
function setP(i){document.getElementById('cmd').value=PRESETS[i];}

// ── PHASES ────────────────────────────────────────────────────
function initPhases(){
  document.getElementById('phases').innerHTML=PHASES.map(p=>`<span class="ph" id="ph-${p.replace(/\s/g,'')}">${p}</span>`).join('');
}
function setPhase(name,pct){
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-lbl').textContent=name;
  const ci=PHASES.indexOf(name);
  PHASES.forEach((p,i)=>{
    const el=document.getElementById('ph-'+p.replace(/\s/g,''));if(!el)return;
    el.className='ph'+(i<ci?' done':p===name?' active':'');
  });
}

// ── LOGGING ───────────────────────────────────────────────────
let logCount=0;
function addLog(modelId,msg,level='info'){
  const m=MODELS.find(x=>x.id===modelId);
  const body=document.getElementById('log-body');
  if(logCount===0)body.innerHTML='';
  logCount++;
  const ts=new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const c=level==='ok'?'#4ade80':level==='warn'?'#fbbf24':level==='act'?'#a78bfa':'#7777aa';
  const sym=level==='ok'?'✓':level==='warn'?'!':level==='act'?'›':'·';
  const d=document.createElement('div');d.className='log-line';
  d.innerHTML=`<span class="log-time">${ts}</span><span class="log-who" style="color:${m?.color||'#666'}">${m?.name.split(' ')[0]||modelId}</span><span class="log-sym" style="color:${c}">${sym}</span><span class="log-txt ${level}">${msg}</span>`;
  body.appendChild(d);body.scrollTop=body.scrollHeight;
}
function setModelStatus(id,s){
  modelStatuses[id]=s;
  if(document.getElementById('modal').classList.contains('open'))renderModelGrid();
}

// ── OUTPUT ────────────────────────────────────────────────────
function addOutput(type,title,content){
  outputs.push({type,title,content});
  renderTabs();
  showOutput(outputs.length-1);
  document.getElementById('toggle-view-btn').style.display=['website','app'].includes(type)?'block':'none';
}
function renderTabs(){
  const labels={website:'Website',app:'Applicatie',code:'Broncode',report:'Rapport',ads:'Marketing'};
  document.getElementById('out-tabs').innerHTML=outputs.map((o,i)=>
    `<button class="out-tab${i===activeOut?' act':''}" onclick="showOutput(${i})">${labels[o.type]||o.type}</button>`
  ).join('');
}
function showOutput(i){
  activeOut=i; viewMode='preview'; renderTabs();
  const o=outputs[i]; if(!o)return;
  const isH=['website','app'].includes(o.type);
  const tv=document.getElementById('toggle-view-btn');
  tv.style.display=isH?'block':'none';
  tv.textContent='Broncode';
  renderSplit(o,isH);
}
function renderSplit(o,isH){
  const sv=document.getElementById('split-view');
  if(isH && viewMode==='preview'){
    sv.innerHTML=`
      <div class="split-pane">
        <div class="split-hdr"><span class="split-hdr-dot"></span> Live preview</div>
        <iframe class="preview-iframe" sandbox="allow-scripts allow-same-origin" srcdoc="${escAttr(o.content)}"></iframe>
      </div>
      <div class="split-pane">
        <div class="split-hdr" style="--dot-c:#4f6ef7"><span class="split-hdr-dot" style="background:#4f6ef7"></span> Broncode</div>
        <div class="code-view">${escHtml(o.content)}</div>
      </div>`;
  } else {
    sv.innerHTML=`
      <div class="split-pane" style="grid-column:1/-1">
        <div class="split-hdr"><span class="split-hdr-dot" style="background:#4f6ef7"></span> ${isH?'Broncode':'Inhoud'}</div>
        <div class="code-view">${escHtml(o.content)}</div>
      </div>`;
  }
}
function toggleView(){
  const o=outputs[activeOut]; if(!o)return;
  const isH=['website','app'].includes(o.type);
  viewMode=viewMode==='preview'?'code':'preview';
  document.getElementById('toggle-view-btn').textContent=viewMode==='preview'?'Broncode':'Preview';
  renderSplit(o,isH);
}
function dlActive(){
  const o=outputs[activeOut]; if(!o)return;
  const ext=['website','app'].includes(o.type)?'html':o.type==='report'?'md':'txt';
  dl(o.title.replace(/\s+/g,'-').toLowerCase()+'.'+ext,o.content);
}
function dlAll(){outputs.forEach((o,i)=>setTimeout(()=>{
  const ext=['website','app'].includes(o.type)?'html':o.type==='report'?'md':'txt';
  dl(o.title.replace(/\s+/g,'-').toLowerCase()+'.'+ext,o.content);
},i*400));}
function dl(name,content){
  const b=new Blob([content],{type:'text/plain'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}
function escAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function intent(cmd){
  const l=cmd.toLowerCase();
  if(l.includes('drop')||l.includes('shop')||l.includes('winkel')||l.includes('product')&&l.includes('verkoop'))return'shop';
  if(l.includes('ps5')||l.includes('game')||l.includes('spel'))return'game';
  if(l.includes('belast')||l.includes('bv ')||l.includes('btw')||l.includes('fiscaal'))return'tax';
  if(l.includes('3d')||l.includes('visualis'))return'3d';
  if(l.includes('marketing')||l.includes('campagne'))return'marketing';
  return'general';
}

// ── MAIN TASK ─────────────────────────────────────────────────
const delay=ms=>new Promise(r=>setTimeout(r,ms));

async function runTask(){
  const cmd=document.getElementById('cmd').value.trim();
  if(!cmd||running)return;
  const budget=parseFloat(document.getElementById('bgt').value)||null;
  const type=intent(cmd);

  running=true;outputs=[];activeOut=0;logCount=0;
  document.getElementById('cmd').disabled=true;
  document.getElementById('bgt').disabled=true;
  document.getElementById('action-area').innerHTML='<button class="stop-btn" onclick="stopTask()" style="width:100%">Stop</button>';
  document.getElementById('ldot').classList.add('on');
  document.getElementById('live-lbl').textContent='Actief';
  document.getElementById('prog-strip').style.display='block';
  document.getElementById('done-strip').style.display='none';
  document.getElementById('warn-strip').style.display='none';
  document.getElementById('log-body').innerHTML='';
  document.getElementById('split-view').innerHTML='<div class="out-placeholder" style="grid-column:1/-1"><div class="out-placeholder-icon">◻</div><div class="out-placeholder-txt">Verwerken...</div></div>';
  document.getElementById('out-tabs').innerHTML='';
  initPhases();
  MODELS.forEach(m=>setModelStatus(m.id,'idle'));

  // FASE 1
  setPhase('Initialisatie',8);
  setModelStatus('perplexity','working');
  addLog('perplexity','Opdracht ontvangen: '+type);
  await delay(500);
  addLog('perplexity','Modellen geselecteerd voor taak','act');
  setModelStatus('perplexity','done');

  // FASE 2
  setPhase('Onderzoek',22);
  setModelStatus('gpt4','working');
  addLog('gpt4','Marktdata ophalen...');
  await delay(600);
  if(type==='shop'){addLog('gpt4','6 trending producten geïdentificeerd','ok');await delay(400);addLog('gpt4','Gemiddelde marge: 70% — boven benchmark','ok');}
  else if(type==='tax'){addLog('perplexity','Belastingtarieven 2024-2025 geverifieerd','ok');await delay(400);addLog('gpt4','IB vs BV berekening gestart','act');}
  else if(type==='game'){addLog('perplexity','PS5 specs opgehaald','ok');await delay(400);addLog('gpt4','UE5 architectuur geanalyseerd','act');}
  else{addLog('gpt4','Analyse gereed','ok');}
  setModelStatus('gpt4','done');

  // FASE 3
  setPhase('Analyse',38);
  setModelStatus('claude','working');
  addLog('claude','Structuur en requirements analyseren...');
  await delay(700);
  addLog('claude','Structuur vastgesteld','ok');
  setModelStatus('claude','done');

  // FASE 4
  setPhase('Generatie',55);
  setModelStatus('gpt4','working');
  addLog('gpt4','Content genereren...');
  await delay(800);
  addLog('gpt4','Gegenereerd','ok');
  if(type==='shop'||type==='3d'){setModelStatus('dalle','working');addLog('dalle','Visuele elementen voorbereiden...');await delay(500);addLog('dalle','Gereed','ok');setModelStatus('dalle','done');}
  setModelStatus('gpt4','done');

  // FASE 5
  setPhase('Verificatie',72);
  setModelStatus('gemini','working');
  addLog('gemini','Cross-model verificatie...');
  await delay(700);
  addLog('gemini','Geen inconsistenties gevonden','ok');
  setModelStatus('gemini','done');
  setModelStatus('grok','working');
  addLog('grok','Realtime check...');
  await delay(400);
  addLog('grok','Data actueel bevestigd','ok');
  setModelStatus('grok','done');

  // FASE 6
  setPhase('Optimalisatie',86);
  setModelStatus('mistral','working');
  addLog('mistral','Output optimaliseren...');
  await delay(500);
  addLog('mistral','Kwaliteitsscore: 96/100','ok');
  setModelStatus('mistral','done');
  if(budget){
    const used=budget*.12;
    document.getElementById('warn-strip').textContent=`Budget: €${Math.round(used)} van €${budget} gebruikt (${Math.round(used/budget*100)}%)`;
    document.getElementById('warn-strip').style.display='block';
  }

  // FASE 7 — UITVOER
  setPhase('Uitvoer',97);
  addLog('claude','Deliverables samenstellen...','act');
  await delay(600);

  if(type==='shop'){
    addOutput('website','TrendShop 2026',makeShop(budget));
    addLog('claude','Webshop gegenereerd met 6 producten','ok');
  } else if(type==='tax'){
    addOutput('app','Fiscale Analyse',makeTax(cmd,budget));
    addLog('claude','Fiscaal rapport gegenereerd','ok');
  } else if(type==='3d'){
    addOutput('app','3D Configurator',make3D());
    addLog('claude','3D viewer gebouwd','ok');
  } else if(type==='game'){
    const {webApp,code}=makeGame(cmd,budget);
    addOutput('app','Game Blueprint',webApp);
    addOutput('code','Broncode architectuur',code);
    addLog('claude','Game blueprint gegenereerd','ok');
  } else {
    addOutput('website','Project Output',makeShop(budget));
    addLog('claude','Output gegenereerd','ok');
  }

  setPhase('Uitvoer',100);
  addLog('gpt4','Taak voltooid','ok');

  document.getElementById('done-strip').style.display='flex';
  document.getElementById('done-sub').textContent=`${outputs.length} bestand(en) klaar voor export`;
  document.getElementById('ldot').classList.remove('on');
  document.getElementById('live-lbl').textContent='Gereed';
  running=false;
  document.getElementById('cmd').disabled=false;
  document.getElementById('bgt').disabled=false;
  document.getElementById('action-area').innerHTML='<button class="run-btn" onclick="runTask()" style="width:100%">Uitvoeren</button>';
  MODELS.forEach(m=>setModelStatus(m.id,'idle'));
}

function stopTask(){
  running=false;
  addLog('gpt4','Gestopt door gebruiker','warn');
  document.getElementById('ldot').classList.remove('on');
  document.getElementById('live-lbl').textContent='Gestopt';
  document.getElementById('cmd').disabled=false;
  document.getElementById('bgt').disabled=false;
  document.getElementById('action-area').innerHTML='<button class="run-btn" onclick="runTask()" style="width:100%">Uitvoeren</button>';
  MODELS.forEach(m=>setModelStatus(m.id,'idle'));
}
